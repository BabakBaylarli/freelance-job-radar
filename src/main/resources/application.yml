spring:
  application:
    name: freelance-job-radar
  config:
    # User-editable matching rules (weights, excludes, threshold). Optional so tests/dev work without it.
    import: optional:file:./config/keywords.yml,optional:file:./config/channels.yml,optional:file:./config/apply.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${DB_USER:jobradar}
    password: ${DB_PASSWORD:jobradar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: freelance-job-radar

logging:
  level:
    root: INFO
    com.babakbaylarli.jobradar: INFO
    org.hibernate.SQL: WARN
  # Console format is human readable by default. Docker sets LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash (JSON).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{source:-main}] %logger{36} - %msg%n"

jobradar:
  # Secrets come from the environment only - nothing is committed.
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    owner-chat-id: ${TELEGRAM_OWNER_CHAT_ID:}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
    effort: medium
    max-tokens: 2000
  profile-path: ${PROFILE_PATH:config/profile.md}

  notifications:
    max-per-hour: ${NOTIFY_MAX_PER_HOUR:6}
    digest-size: 10
    digest-min-interval: PT6H
    quiet-hours:
      enabled: ${QUIET_HOURS_ENABLED:true}
      start: ${QUIET_HOURS_START:00:00}
      end: ${QUIET_HOURS_END:08:00}
      zone: ${QUIET_HOURS_ZONE:Asia/Baku}

  # One-tap apply: nothing is ever sent without your explicit approval of that specific job. Personal values (rates,
  # portfolio links) live in config/apply.yml.
  apply:
    daily-limit: ${APPLY_DAILY_LIMIT:10}      # applications the bot may send per day, all platforms together
    min-gap: PT2M                             # minimum time between two sends
    default-days: 7
    cv-path: ${CV_PATH:config/cv.pdf}          # attached to e-mail applications if the file exists
    zone: ${APPLY_ZONE:Asia/Baku}              # defines "today" for the daily limits
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      starttls: true
    freelancer-milestone-percentage: ${FREELANCER_MILESTONE_PERCENTAGE:}

  # Each source can be switched off and given its own poll interval.
  # Remotive asks API users not to poll more than a few times a day, so keep it at 6h or more.
  # A source that needs a token/e-mail which is not set is skipped with one warning (see /sources in the bot).
  sources:
    we-work-remotely:
      enabled: true
      poll-interval: PT3H
    remotive:
      enabled: true
      poll-interval: PT6H
      category: software-dev
    remote-ok:
      enabled: true
      poll-interval: PT6H
    hacker-news:
      enabled: true
      poll-interval: PT6H
      remote-only: true
    freelancer:                       # Freelancer.com Projects API; token is optional
      enabled: true
      poll-interval: PT6H
      token: ${FREELANCER_TOKEN:}
      queries: [java, spring boot]
    himalayas:                        # anonymous use is rate limited: keep few queries; key is optional
      enabled: true
      poll-interval: PT6H
      token: ${HIMALAYAS_API_KEY:}
      queries: [java]
    jobicy:
      enabled: true
      poll-interval: PT6H
      tags: [java, backend]
    working-nomads:
      enabled: true
      poll-interval: PT6H
    fl-ru:                            # RU - official RSS; add more feeds (other categories) to the list
      enabled: true
      poll-interval: PT3H
      feeds: ["/rss/all.xml?category=5"]
    hh:                               # RU - needs HH_CONTACT_EMAIL for the HH-User-Agent header
      enabled: true
      poll-interval: PT6H
      contact-email: ${HH_CONTACT_EMAIL:}
      queries: [java, spring]
      work-format: REMOTE
      employment-forms: [PROJECT, PART]
    freelancehunt:                    # UA - needs FREELANCEHUNT_TOKEN
      enabled: true
      poll-interval: PT3H
      token: ${FREELANCEHUNT_TOKEN:}
      skill-ids: []
    dou:                              # UA - official vacancy RSS
      enabled: true
      poll-interval: PT6H
      categories: [Java]
      remote: true
    email-alerts:                     # job alert e-mails over IMAP (Gmail App Password); off by default
      enabled: ${EMAIL_ALERTS_ENABLED:false}
      poll-interval: PT15M
      host: ${MAIL_IMAP_HOST:imap.gmail.com}
      username: ${MAIL_USERNAME:}
      app-password: ${MAIL_APP_PASSWORD:}
      folder: ${MAIL_FOLDER:JobAlerts}
    telegram-channels:                # public channels via the Telegram client API; off by default
      enabled: ${TELEGRAM_CHANNELS_ENABLED:false}
      poll-interval: PT30M
      api-id: ${TELEGRAM_API_ID:}
      api-hash: ${TELEGRAM_API_HASH:}
      phone: ${TELEGRAM_PHONE:}
      session-dir: ${TELEGRAM_SESSION_DIR:/data/tdlight}
