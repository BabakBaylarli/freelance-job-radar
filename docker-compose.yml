# Freelance Job Radar: the app + PostgreSQL.
#   cp .env.example .env   (fill in TELEGRAM_BOT_TOKEN, ...)
#   cp config/profile.example.md config/profile.md   (edit: your skills and portfolio)
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobradar
      DB_USER: jobradar
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash   # one JSON object per log line
    volumes:
      # keywords.yml (matching rules), channels.yml (Telegram channels to read) and profile.md (your profile for
      # proposals) - edit, then `docker compose restart app`
      - ./config:/app/config:ro
      # Telegram client session for the optional channel source (created once with: docker compose run --rm -it app --telegram-login)
      - tdlight-session:/data/tdlight
    ports:
      - "127.0.0.1:8080:8080"   # health endpoint, only reachable from this machine

volumes:
  pgdata:
  tdlight-session:
